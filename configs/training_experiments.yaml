# Topologia dos experimentos do TCC.
#
# Parâmetros de hardware, treino, LoRA, modelos e caminhos de datasets ficam em:
#   configs/runtime.yaml
#
# Este arquivo define apenas a relação entre as etapas.

global: {}

general_models:
  det_general:
    enabled: true
    label: "Detecção — Modelo Geral (dataset amplo)"
    task: detect
    regime: general_model
    name: det_general_yolo26n
    train_args:
      freeze: 0

  seg_general:
    enabled: false
    label: "Segmentação — Modelo Geral (dataset amplo)"
    task: segment
    regime: general_model
    name: seg_general_yolo26n
    train_args:
      freeze: 0

lora_specialists:
  det_lora_01: {enabled: false, label: "Detecção — LoRA Especialista 01", task: detect, regime: lora_specialist, base_from: det_general, name: det_lora_01}
  det_lora_02: {enabled: false, label: "Detecção — LoRA Especialista 02", task: detect, regime: lora_specialist, base_from: det_general, name: det_lora_02}
  det_lora_03: {enabled: false, label: "Detecção — LoRA Especialista 03", task: detect, regime: lora_specialist, base_from: det_general, name: det_lora_03}
  det_lora_04: {enabled: false, label: "Detecção — LoRA Especialista 04", task: detect, regime: lora_specialist, base_from: det_general, name: det_lora_04}
  det_lora_05: {enabled: false, label: "Detecção — LoRA Especialista 05", task: detect, regime: lora_specialist, base_from: det_general, name: det_lora_05}

  seg_lora_01: {enabled: false, label: "Segmentação — LoRA Especialista 01", task: segment, regime: lora_specialist, base_from: seg_general, name: seg_lora_01}
  seg_lora_02: {enabled: false, label: "Segmentação — LoRA Especialista 02", task: segment, regime: lora_specialist, base_from: seg_general, name: seg_lora_02}
  seg_lora_03: {enabled: false, label: "Segmentação — LoRA Especialista 03", task: segment, regime: lora_specialist, base_from: seg_general, name: seg_lora_03}
  seg_lora_04: {enabled: false, label: "Segmentação — LoRA Especialista 04", task: segment, regime: lora_specialist, base_from: seg_general, name: seg_lora_04}
  seg_lora_05: {enabled: false, label: "Segmentação — LoRA Especialista 05", task: segment, regime: lora_specialist, base_from: seg_general, name: seg_lora_05}

full_finetune_controls:
  det_fullft_01: {enabled: false, label: "Detecção — Full Fine-Tune Controle 01", task: detect, regime: full_finetune_specialist, base_from: det_general, name: det_fullft_01, train_args: {freeze: 0}}
  det_fullft_02: {enabled: false, label: "Detecção — Full Fine-Tune Controle 02", task: detect, regime: full_finetune_specialist, base_from: det_general, name: det_fullft_02, train_args: {freeze: 0}}
  det_fullft_03: {enabled: false, label: "Detecção — Full Fine-Tune Controle 03", task: detect, regime: full_finetune_specialist, base_from: det_general, name: det_fullft_03, train_args: {freeze: 0}}
  det_fullft_04: {enabled: false, label: "Detecção — Full Fine-Tune Controle 04", task: detect, regime: full_finetune_specialist, base_from: det_general, name: det_fullft_04, train_args: {freeze: 0}}
  det_fullft_05: {enabled: false, label: "Detecção — Full Fine-Tune Controle 05", task: detect, regime: full_finetune_specialist, base_from: det_general, name: det_fullft_05, train_args: {freeze: 0}}

  seg_fullft_01: {enabled: false, label: "Segmentação — Full Fine-Tune Controle 01", task: segment, regime: full_finetune_specialist, base_from: seg_general, name: seg_fullft_01, train_args: {freeze: 0}}
  seg_fullft_02: {enabled: false, label: "Segmentação — Full Fine-Tune Controle 02", task: segment, regime: full_finetune_specialist, base_from: seg_general, name: seg_fullft_02, train_args: {freeze: 0}}
  seg_fullft_03: {enabled: false, label: "Segmentação — Full Fine-Tune Controle 03", task: segment, regime: full_finetune_specialist, base_from: seg_general, name: seg_fullft_03, train_args: {freeze: 0}}
  seg_fullft_04: {enabled: false, label: "Segmentação — Full Fine-Tune Controle 04", task: segment, regime: full_finetune_specialist, base_from: seg_general, name: seg_fullft_04, train_args: {freeze: 0}}
  seg_fullft_05: {enabled: false, label: "Segmentação — Full Fine-Tune Controle 05", task: segment, regime: full_finetune_specialist, base_from: seg_general, name: seg_fullft_05, train_args: {freeze: 0}}

smoke_tests:
  smoke_det_yolo26n:
    enabled: true
    label: "Smoke Test — YOLO26n Detecção"
    task: detect
    regime: smoke
    name: smoke_det_yolo26n

  smoke_seg_yolo26n:
    enabled: false
    label: "Smoke Test — YOLO26n Segmentação"
    task: segment
    regime: smoke
    name: smoke_seg_yolo26n
