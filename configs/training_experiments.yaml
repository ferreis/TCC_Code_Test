# Apenas valida ambiente/caminhos/VRAM. Não faz parte da comparação final.
smoke_tests:
  smoke_det_yolo26n:
    enabled: true
    label: "Smoke Test — YOLO26n Detecção"
    task: detect
    regime: smoke
    model: yolo26n.pt
    data: data/roboflow/data.yaml
    name: smoke_det_yolo26n
    train_args:
      epochs: 3
      batch: 8
      imgsz: 640

  smoke_seg_yolo26n:
    enabled: false
    label: "Smoke Test — YOLO26n Segmentação"
    task: segment
    regime: smoke
    model: yolo26n-seg.pt
    data: data/segmentation/data.yaml
    name: smoke_seg_yolo26n
    train_args:
      epochs: 3
      batch: 8
      imgsz: 640
