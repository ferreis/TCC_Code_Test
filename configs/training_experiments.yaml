# Plano de treinamento do TCC
#
# Hipótese experimental:
#   1) treinar UM MODELO GERAL em um dataset amplo;
#   2) congelar esse modelo geral e treinar adapters LoRA especialistas,
#      cada um em seu próprio dataset pequeno;
#   3) para comparação, treinar um Full Fine-Tune separado usando o MESMO
#      checkpoint geral e o MESMO dataset pequeno de cada LoRA;
#   4) os adapters LoRA permanecem separados e vinculados ao checkpoint geral.
#
# Não treinamos todos os LoRAs juntos. Cada especialista é uma execução independente.
# YOLO26n é mantido como escala inicial/teste para a Tesla T4.

global:
  epochs: 100
  imgsz: 640
  batch: 16
  device: 0
  workers: 2
  amp: true
  optimizer: auto
  patience: 30
  seed: 42
  deterministic: true
  cache: false
  close_mosaic: 10
  save_period: 10
  plots: true
  verbose: true
  project: workspace/training_runs
  eval_split: test

# ETAPA A — modelos gerais treinados em datasets amplos.
general_models:
  det_general:
    enabled: true
    label: "Detecção — Modelo Geral (dataset amplo)"
    task: detect
    regime: general_model
    model: yolo26n.pt
    data: data/roboflow/data.yaml
    name: det_general_yolo26n
    train_args:
      freeze: 0

  seg_general:
    enabled: false
    label: "Segmentação — Modelo Geral (dataset amplo)"
    task: segment
    regime: general_model
    model: yolo26n-seg.pt
    data: data/segmentation/data.yaml
    name: seg_general_yolo26n
    train_args:
      freeze: 0

# ETAPA B — adapters LoRA independentes.
# Todos partem do best.pt do modelo geral correspondente.
# Ative apenas os especialistas cujo data.yaml já existir.
lora_specialists:
  det_lora_01:
    enabled: false
    label: "Detecção — LoRA Especialista 01"
    task: detect
    regime: lora_specialist
    base_from: det_general
    data: data/specialists/detection/lora_01/data.yaml
    name: det_lora_01
    train_args: &lora_detect_args
      lora_r: 16
      lora_alpha: 32
      lora_dropout: 0.10
      lora_gradient_checkpointing: true
      lora_include_head: true

  det_lora_02:
    enabled: false
    label: "Detecção — LoRA Especialista 02"
    task: detect
    regime: lora_specialist
    base_from: det_general
    data: data/specialists/detection/lora_02/data.yaml
    name: det_lora_02
    train_args: *lora_detect_args

  det_lora_03:
    enabled: false
    label: "Detecção — LoRA Especialista 03"
    task: detect
    regime: lora_specialist
    base_from: det_general
    data: data/specialists/detection/lora_03/data.yaml
