    train_args: *lora_detect_args

  det_lora_05:
    enabled: false
    label: "Detecção — LoRA Especialista 05"
    task: detect
    regime: lora_specialist
    base_from: det_general
    data: data/specialists/detection/lora_05/data.yaml
    name: det_lora_05
    train_args: *lora_detect_args

  seg_lora_01:
    enabled: false
    label: "Segmentação — LoRA Especialista 01"
    task: segment
    regime: lora_specialist
    base_from: seg_general
    data: data/specialists/segmentation/lora_01/data.yaml
    name: seg_lora_01
    train_args: &lora_segment_args
      lora_r: 16
      lora_alpha: 32
      lora_dropout: 0.10
      lora_gradient_checkpointing: true
      lora_include_head: true

  seg_lora_02:
    enabled: false
    label: "Segmentação — LoRA Especialista 02"
    task: segment
    regime: lora_specialist
    base_from: seg_general
    data: data/specialists/segmentation/lora_02/data.yaml
    name: seg_lora_02
    train_args: *lora_segment_args

  seg_lora_03:
    enabled: false
    label: "Segmentação — LoRA Especialista 03"
    task: segment
    regime: lora_specialist
    base_from: seg_general
    data: data/specialists/segmentation/lora_03/data.yaml
    name: seg_lora_03
    train_args: *lora_segment_args

  seg_lora_04:
    enabled: false
    label: "Segmentação — LoRA Especialista 04"
    task: segment
    regime: lora_specialist
    base_from: seg_general
    data: data/specialists/segmentation/lora_04/data.yaml
    name: seg_lora_04
    train_args: *lora_segment_args

  seg_lora_05:
    enabled: false
    label: "Segmentação — LoRA Especialista 05"
    task: segment
    regime: lora_specialist
    base_from: seg_general
    data: data/specialists/segmentation/lora_05/data.yaml
    name: seg_lora_05
    train_args: *lora_segment_args

# ETAPA C — controles Full Fine-Tune.
